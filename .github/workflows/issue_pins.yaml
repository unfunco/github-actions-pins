name: Issue / Add Pins

on:
  issues:
    types: [ opened ]

concurrency:
  cancel-in-progress: false
  group: issue-pins-${{ github.event.issue.number }}

jobs:
  add-pins:
    if: >-
      github.event.issue.title == 'Add actions to pin list' &&
      contains(github.event.issue.labels.*.name, 'pins')
    name: Add Pins
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Add requested actions
      id: add-actions
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        python3 .github/scripts/add_actions_from_issue.py \
          --event-file "$GITHUB_EVENT_PATH" \
          --actions-file actions.csv \
          --pins-file pins.json

        if git diff --quiet -- actions.csv pins.json; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Close issue when all actions are already pinned
      if: steps.add-actions.outputs.changed == 'false'
      env:
        GH_TOKEN: ${{ github.token }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
      run: |
        gh issue close "$ISSUE_NUMBER" \
          --comment "All requested actions are already available in the pin list."
    - name: Verify GitHub App configuration
      if: steps.add-actions.outputs.changed == 'true'
      env:
        MERGE_SIMPSON_APP_ID: ${{ vars.MERGE_SIMPSON_APP_ID }}
        MERGE_SIMPSON_APP_PRIVATE_KEY: ${{ secrets.MERGE_SIMPSON_APP_PRIVATE_KEY }}
      run: |
        set -euo pipefail

        : "${MERGE_SIMPSON_APP_ID:?Set repository variable MERGE_SIMPSON_APP_ID.}"
        : "${MERGE_SIMPSON_APP_PRIVATE_KEY:?Set repository secret MERGE_SIMPSON_APP_PRIVATE_KEY.}"
    - name: Create GitHub App token
      id: app-token
      if: steps.add-actions.outputs.changed == 'true'
      uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
      with:
        app-id: ${{ vars.MERGE_SIMPSON_APP_ID }}
        private-key: ${{ secrets.MERGE_SIMPSON_APP_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write
    - name: Look up GitHub App bot user
      id: app-user
      if: steps.add-actions.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        user_id="$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)"
        echo "user-id=$user_id" >> "$GITHUB_OUTPUT"
    - name: Create pull request
      id: create-pull-request
      if: steps.add-actions.outputs.changed == 'true'
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
      run: |
        set -euo pipefail

        git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
        git config user.email "${{ steps.app-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

        branch="add-pins-from-issue-${ISSUE_NUMBER}"
        git checkout -b "$branch"
        git add actions.csv pins.json

        staged_files="$(git diff --cached --name-only)"
        unexpected_files="$(printf '%s\n' "$staged_files" | grep -vE '^(actions\.csv|pins\.json)$' || true)"
        if [[ -z "$staged_files" || -n "$unexpected_files" ]]; then
          >&2 echo "Expected only actions.csv and/or pins.json to be staged, got:"
          >&2 echo "$staged_files"
          exit 1
        fi

        git commit -m "feat(pins): Add actions from issue #${ISSUE_NUMBER}"
        git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"

        pr_url="$(gh pr create \
          --title "feat(pins): Add actions from issue #${ISSUE_NUMBER}" \
          --body "Adds the actions requested in #${ISSUE_NUMBER} to the source and published pin data. Closes #${ISSUE_NUMBER}." \
          --label "automata 🤖" \
          --label "feature 🎉" \
          --head "$branch" \
          --base main)"

        echo "pr-url=$pr_url" >> "$GITHUB_OUTPUT"
    - name: Enable pull request auto-merge
      if: steps.add-actions.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: gh pr merge --auto --squash --delete-branch "${{ steps.create-pull-request.outputs.pr-url }}"
